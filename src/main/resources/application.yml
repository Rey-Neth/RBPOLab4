spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: "1БКС24064"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/survey_lab4}
    username: ${DB_USER:survey_lab4_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
